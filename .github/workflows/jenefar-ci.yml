name: Jenefar CI

on:
  push:
    branches:
      - main
      - phase*
  pull_request:
    branches:
      - main
      - "phase*"


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Install optional tools
      run: |
        pip install pytest ruff


    - name: Syntax check
      run: |
        python -m compileall jenefar


    - name: Lint production code
      run: |
        ruff check jenefar/security jenefar/execution jenefar/memory/manager_v2.py jenefar/production jenefar/observability jenefar/core/production_runtime.py tests/test_phases_13_24.py tests/test_live_runtime_integration.py


    - name: Run tests
      run: |
        pytest -v
