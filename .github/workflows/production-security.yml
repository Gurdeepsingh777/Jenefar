name: Production Security

on:
  pull_request:
    branches: ["phase1-monitoring"]
  push:
    branches: ["phase1-monitoring"]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --strict
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:8.24.3 detect --source /repo --no-git --redact --exit-code 1
      - name: Compile
        run: python -m compileall -q jenefar
