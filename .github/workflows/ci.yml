name: CI

on:
  push:
    branches: [main, "integration/phases-7-24"]
  pull_request:
    branches: [main, "fix/offline-fallback-right-rail", "integration/phases-7-24"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m compileall -q jenefar run.py main.py config.py agent tools
      - name: Validate dashboard JavaScript
        run: node --check jenefar/avatar/web/app.js
      - name: Run all automated tests
        run: python -m pytest -q
