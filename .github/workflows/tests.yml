name: tests

on:
  push:
    branches: ["main", "phase4-safe-gui-memory-events", "fix/mic-skills-ui-reliability"]
  pull_request:
    branches: ["main", "fix/mic-skills-ui-reliability"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      JENEFAR_DESKTOP_BACKEND: headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check jenefar/avatar/web/app.js
      - name: Run tests
        run: python -m pytest -q
