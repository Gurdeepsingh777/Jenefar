name: Telegram Agent CI

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "config.py"
      - "agent/**"
      - "tools/github_tools.py"
      - "tools/utility_tools.py"
      - "tools/skill_tools.py"
      - "requirements-telegram.txt"
      - "tests/test_telegram_agent.py"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "config.py"
      - "agent/**"
      - "tools/github_tools.py"
      - "tools/utility_tools.py"
      - "requirements-telegram.txt"
      - "tests/test_telegram_agent.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-telegram.txt
      - name: Install Telegram agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-telegram.txt pytest
      - name: Compile source
        run: python -m compileall -q main.py config.py agent tools/github_tools.py tools/utility_tools.py tools/skill_tools.py
      - name: Run Telegram agent tests
        run: python -m pytest -q tests/test_telegram_agent.py
