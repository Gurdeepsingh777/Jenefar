assistant:
  name: Jenefar
  wake_phrases:
    - "hi jenefar"
    - "hello jenefar"
  require_wake_phrase: true
  single_turn_sleep: true

runtime:
  require_confirmation_for_tools: false
  command_timeout_seconds: 30

security:
  # Keep empty until you explicitly configure assets you are authorized to test.
  # Supports exact host/IP values and IPv4/IPv6 CIDRs.
  authorized_targets: []
  audit_log_path: "data/audit.jsonl"

agents:
  master: true
  coding: true
  repository: true
  cybersecurity: true
  kali: true
  bugbounty: true
  robotics: true
  research: true
  automation: true
  gui_vision: true
