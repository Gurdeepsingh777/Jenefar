<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jenefar Avatar</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <main id="stage" data-state="idle">
    <div class="backdrop"></div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <canvas id="vrm-canvas" aria-hidden="true"></canvas>

    <section class="avatar-shell">
      <div class="halo halo-a"></div>
      <div class="halo halo-b"></div>
      <div class="avatar-glow"></div>

      <div class="avatar">
        <svg viewBox="0 0 420 520" role="img" aria-label="Jenefar AI avatar">
          <defs>
            <radialGradient id="skin" cx="50%" cy="35%" r="80%">
              <stop offset="0%" stop-color="#ffe9e0"/>
              <stop offset="100%" stop-color="#c99ea9"/>
            </radialGradient>
            <linearGradient id="hair" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#120d20"/>
              <stop offset="55%" stop-color="#302054"/>
              <stop offset="100%" stop-color="#09080f"/>
            </linearGradient>
            <linearGradient id="suit" x1="0" x2="1">
              <stop offset="0%" stop-color="#090d16"/>
              <stop offset="50%" stop-color="#182033"/>
              <stop offset="100%" stop-color="#090d16"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="6" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <path class="hair" d="M84 232C44 72 114 5 210 13c104-7 174 70 126 216-16 48-33 84-62 119H144c-29-35-47-71-60-116Z"/>
          <path class="hair-light" d="M110 198C84 90 143 36 211 36c76 0 126 73 96 168-24-31-47-42-74-47-38-8-76 1-123 41Z"/>

          <ellipse cx="210" cy="205" rx="104" ry="125" fill="url(#skin)"/>
          <path class="ear" d="M106 194c-24-2-30 16-20 40 7 17 19 24 29 17zM314 194c24-2 30 16 20 40-7 17-19 24-29 17z"/>

          <path class="brow" d="M142 167c19-14 39-15 55-4M223 163c16-10 38-10 55 4"/>
          <ellipse class="eye" cx="171" cy="186" rx="18" ry="11"/>
          <ellipse class="eye" cx="249" cy="186" rx="18" ry="11"/>
          <circle class="iris" cx="171" cy="186" r="6"/>
          <circle class="iris" cx="249" cy="186" r="6"/>

          <path class="nose" d="M206 184c-2 18-8 31-15 42 7 5 16 7 27 3"/>
          <path class="mouth" d="M173 255c22 15 53 15 75 0-16 26-59 30-75 0Z"/>

          <path class="mark mark-a" d="M118 220l24-28"/>
          <path class="mark mark-b" d="M302 220l-24-28"/>

          <path class="neck" d="M167 308v63h86v-63"/>
          <path class="suit" d="M167 354c-52 4-99 38-122 105v51h330v-51c-23-67-70-101-122-105z" fill="url(#suit)"/>
          <path class="core" d="M210 364l30 34-30 50-30-50z" filter="url(#glow)"/>

          <path class="collar" d="M166 350l44 45 44-45 10 50-54 58-54-58z"/>
          <path class="accent" d="M124 392l54 64M296 392l-54 64"/>
          <circle class="core-dot" cx="210" cy="397" r="8" filter="url(#glow)"/>
        </svg>
      </div>

      <div class="status-card">
        <div class="pulse-dot"></div>
        <div>
          <div id="state">IDLE</div>
          <div id="caption">Jenefar is ready</div>
        </div>
      </div>
    </section>

    <div class="realtime-controls">
      <button id="realtime-button">START REALTIME</button>
      <span id="realtime-state">OFFLINE</span>
      <span id="vrm-status">PROCEDURAL AVATAR</span>
    </div>
    <div class="mode-pill">3D VRM • PARTICLE FIELD • REALTIME VOICE</div>
  </main>
  <script src="/app.js"></script>
  <script type="module" src="/vrm.js"></script>
  <script src="/realtime.js"></script>
</body>
</html>
